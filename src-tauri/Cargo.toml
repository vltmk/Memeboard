[package]
name = "memeboard"
version = "0.2.0"
description = "Memeboard - Discord-Style Microphone Soundboard"
authors = ["Memeboard Authors"]
edition = "2024"
default-run = "memeboard"

[lib]
name = "memeboard_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
audio_thread_priority = "0.32"
symphonia = { version = "0.5.4", features = ["all"] }
mousiki = "0.2.1"
rubato = "0.16"
ringbuf = "0.4"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6.0"
socket2 = { version = "0.5", features = ["all"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2.28"
x11rb = { version = "0.13", features = ["xinput"] }
xkbcommon = "0.8"
ashpd = { version = "0.10", default-features = false, features = ["tokio"] }
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt", "time"] }
ctrlc = { version = "3.4", features = ["termination"] }

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
